plugins {
	id 'java-library'
	id 'maven-publish'
}

group = 'com.github.sep-es-br'
version = '1.1.1'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}


dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:2.2.12.RELEASE')
    implementation 'org.springframework.boot:spring-boot-starter'


    implementation 'com.github.sep-es-br:pmo-core-organization-parser:1.1.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'

}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'organization-parser-goves'
        }
    }
}
